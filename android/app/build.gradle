plugins {
    id 'com.android.application'
}

// Release signing reads android/app/keystore.properties and the keystore next to it.
// If keystore.properties is missing, the release APK is left unsigned.
def keystorePropsFile = project.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.nearchain.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nearchain.app'
        minSdk 21
        targetSdk 34
        // CI passes the workflow run number as versionCode, so every build is newer than the last.
        versionCode((project.findProperty('nearchainVersionCode') ?: '1') as Integer)
        versionName(project.findProperty('nearchainVersionName') ?: '0.1.0')
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile project.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Ed25519 signing and scrypt for Android versions before 13, where the platform lacks them.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
}
