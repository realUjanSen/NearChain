plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nearchain.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nearchain.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Ed25519 signing and scrypt for Android versions before 13, where the platform lacks them.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
}