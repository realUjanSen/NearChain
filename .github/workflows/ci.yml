name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Core and network tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python run_tests.py

  android-build:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nearchain-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows-build:
    name: Windows executable (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NearChain.exe
        shell: cmd
        run: build\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: nearchain-windows
          path: dist/NearChain/
          if-no-files-found: error
