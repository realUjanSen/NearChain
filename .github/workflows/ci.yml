name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Core and network tests (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python run_tests.py

  android-build:
    name: Android debug build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK contents
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK ($(stat -c %s "$APK") bytes)"
          unzip -l "$APK"
          unzip -p "$APK" classes.dex > /tmp/classes.dex || { echo "classes.dex missing"; exit 1; }
          SIZE=$(stat -c %s /tmp/classes.dex)
          echo "classes.dex: $SIZE bytes"
          [ "$SIZE" -gt 5000 ] || { echo "classes.dex too small"; exit 1; }
          grep -aq "com/nearchain/app/MainActivity" /tmp/classes.dex || { echo "MainActivity not in dex"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "manifest missing"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: nearchain-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows-build:
    name: Windows executable (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build NearChain.exe
        shell: cmd
        run: build\build_windows.bat
      - uses: actions/upload-artifact@v5
        with:
          name: nearchain-windows
          path: dist/NearChain/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [python-tests, android-build, windows-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: nearchain-debug-apk
          path: release/apk
      - uses: actions/download-artifact@v5
        with:
          name: nearchain-windows
          path: release/windows/NearChain
      - name: Package files for the release
        run: |
          cd release
          mv apk/*.apk NearChain-debug.apk
          (cd windows && zip -qr ../NearChain-windows.zip NearChain)
          ls -l
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/NearChain-debug.apk release/NearChain-windows.zip --clobber
          else
            gh release create "$TAG" release/NearChain-debug.apk release/NearChain-windows.zip \
              --title "NearChain $TAG" --generate-notes
          fi